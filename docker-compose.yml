version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-weaving-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://storyweaver:weavingpass@postgres:5432/story_weaving?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: story-weaving-db
    environment:
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: weavingpass
      POSTGRES_DB: story_weaving
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: story-weaving-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
