version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: story-weaving-db
    environment:
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: weavingpass
      POSTGRES_DB: story_weaving
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
